<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Результат - Географический вопроситель</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: white;
        }

        .container {
            padding: 20px;
        }

        .result-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            margin: 20px auto;
            max-width: 900px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .score-container {
            text-align: center;
            margin-bottom: 30px;
        }

        .score-value {
            font-size: 80px;
            font-weight: bold;
            background: linear-gradient(135deg, #ffd700 0%, #ff8c00 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: scoreReveal 0.8s ease-out;
        }

        @keyframes scoreReveal {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            50% {
                transform: scale(1.2);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .score-label {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 10px;
        }

        .distance-info {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
            border-left: 4px solid #ffd700;
        }

        .distance-value {
            font-size: 28px;
            font-weight: bold;
            color: #ffd700;
        }

        .perfect-badge {
            background: linear-gradient(135deg, #ffd700 0%, #ff8c00 100%);
            color: #1a1a2e;
            padding: 5px 15px;
            border-radius: 20px;
            display: inline-block;
            font-weight: bold;
            margin-top: 10px;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .map-container {
            width: 100%;
            height: 400px;
            border-radius: 15px;
            overflow: hidden;
            margin: 20px 0;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .coordinates-compare {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin: 20px 0;
        }

        .coord-box {
            flex: 1;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
        }

        .coord-box h4 {
            margin-bottom: 10px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
        }

        .coord-box .coord {
            font-family: monospace;
            font-size: 14px;
            color: #ffd700;
        }

        .coord-box.user {
            border-left: 3px solid #28a745;
        }

        .coord-box.correct {
            border-left: 3px solid #ffd700;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
        }

        .btn {
            padding: 12px 30px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-next {
            background: linear-gradient(135deg, #28a745 0%, #1e7e34 100%);
            color: white;
        }

        .btn-next:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.4);
        }

        .btn-menu {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .btn-menu:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .progress-bar-container {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            height: 8px;
            overflow: hidden;
            margin: 20px 0;
        }

        .progress-bar-fill {
            background: linear-gradient(90deg, #28a745 0%, #ffd700 100%);
            height: 100%;
            width: 0%;
            transition: width 1s ease;
            border-radius: 10px;
        }

        .location-name {
            text-align: center;
            font-size: 20px;
            margin-bottom: 20px;
            color: #ffd700;
        }

        @media (max-width: 768px) {
            .coordinates-compare {
                flex-direction: column;
            }

            .score-value {
                font-size: 50px;
            }

            .map-container {
                height: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="result-card">
            <div class="score-container">
                <div class="score-value" id="scoreValue">0</div>
                <div class="score-label">ОЧКИ В РАУНДЕ</div>
                <div id="perfectBadge" style="display: none;">
                    <div class="perfect-badge">Как ты так смог? 10000</div>
                </div>
            </div>

            <div class="distance-info">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span>Расстояние до правильного места:</span>
                    <span class="distance-value" id="distanceValue">- км</span>
                </div>
                <div class="progress-bar-container">
                    <div class="progress-bar-fill" id="progressBar"></div>
                </div>
                <div style="font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 10px;">
                    * Чем ближе ваша догадка, тем больше очков
                </div>
            </div>

            <div class="coordinates-compare">
                <div class="coord-box user">
                    <h4>ВАША ДОГАДКА</h4>
                    <div class="coord" id="userCoords">-</div>
                </div>
                <div class="coord-box correct">
                    <h4>ПРАВИЛЬНЫЙ ОТВЕТ</h4>
                    <div class="coord" id="correctCoords">-</div>
                </div>
            </div>

            <div class="map-container">
                <div id="map"></div>
            </div>

            <div class="btn-group">
                <a href="/" class="btn btn-menu">Главное меню</a>
                <button class="btn btn-next" id="nextRoundBtn">Следующий раунд ➜</button>
            </div>
        </div>
    </div>

    <script src="https://api-maps.yandex.ru/2.1/?apikey=722f4f80-99eb-47d8-af1f-0eff526f8546&lang=ru_RU"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
    const ROOM_CODE = "{{ code }}";
    const IS_CREATOR = {{ 'true' if c_id else 'false' }};
    </script>
    {% if code %}
        <script src="{{ url_for('static', filename='js/AnswerLogicMultiplayer.js') }}"></script>
    {% else %}
        <script src="{{ url_for('static', filename='js/AnswerLogic.js') }}"></script>
    {% endif %}
</body>
</html>

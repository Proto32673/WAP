<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Итоги раунда - Географический вопроситель</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --bg-dark: #1a1a2e;
            --card-bg: rgba(255, 255, 255, 0.08);
            --accent-green: #28a745;
        }
        body {
            background: var(--bg-dark);
            color: white;
            padding: 30px 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            overflow-x: hidden;
        }
        .results-wrapper {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            padding: 30px;
            border: 1px solid rgba(255,255,255,0.1);
            max-width: 900px;
            margin: 0 auto;
        }
        #map {
            width: 100%;
            height: 450px;
            border-radius: 20px;
            margin: 25px 0;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .leaderboard { margin-top: 30px; }
        .player-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 25px;
            background: rgba(0,0,0,0.2);
            border-radius: 15px;
            margin-bottom: 10px;
            border-left: 4px solid transparent;
        }
        .rank-1 { border-left-color: #ffd700; background: rgba(255, 215, 0, 0.05); }

        .score-display { color: #ffd700; font-weight: 700; font-size: 1.1rem; }
        .dist-label { font-size: 0.85rem; color: #a0a0a0; }

        .btn-next {
            background: #28a745;
            border: none;
            padding: 15px 40px;
            border-radius: 12px;
            font-weight: bold;
            color: white;
            text-decoration: none;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="results-wrapper">
            <h2 class="text-center fw-bold mb-1">Раунд завершен!</h2>
            <p class="text-center text-white-50 mb-4">Смотрим, кто был ближе всех</p>

            <div id="map"></div>

            <div class="leaderboard">
                <h4 class="mb-4"><i class="bi bi-trophy me-2 text-warning"></i>Таблица лидеров</h4>
                <div id="scoreTable"></div>
            </div>

            <div class="text-center mt-5">
                <a href="/" class="btn-next">Вернуться на главную страницу</a>
            </div>
        </div>
    </div>

    <script src="https://api-maps.yandex.ru/2.1/?apikey=722f4f80-99eb-47d8-af1f-0eff526f8546&lang=ru_RU"></script>
    <script>
    const ROOM_CODE = "{{ code }}";
    </script>
    <script src="{{ url_for('static', filename='js/ResultsLogic.js') }}"></script>
</body>
</html>
